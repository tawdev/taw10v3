name: Deploy TAW10 to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Prepare standalone assets
        run: |
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/

      - name: Network Diagnostic
        run: |
          echo "🔍 Testing connectivity to ${{ secrets.VPS_HOST }}..."
          ping -c 3 ${{ secrets.VPS_HOST }} || echo "⚠️ Ping failed"
          echo "🔍 Testing SSH port 22..."
          nc -zv -w 5 ${{ secrets.VPS_HOST }} 22 || echo "⚠️ Port 22 unreachable"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          debug: true
          script_stop: true
          script: |
            cd /var/www/taw10
            git config --global --add safe.directory /var/www/taw10
            
            # Discard any local changes on the server to prevent merge conflicts
            git reset --hard HEAD
            git clean -fd
            
            git pull origin main

            # Install deps & build on server
            npm ci
            npm run build

            # Copy required assets for standalone mode
            cp -r public .next/standalone/
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/

            # Restart both PM2 instances
            echo "--- PM2 Restarting ---"
            mkdir -p logs
            pm2 reload ecosystem.config.js --update-env || pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
            pm2 save

            echo "--- PM2 Status ---"
            pm2 status

            echo "--- Waiting for apps to start ---"
            sleep 5

            echo "--- PM2 Status after 5s ---"
            pm2 status

            echo "--- PM2 Logs (Last 50 lines) ---"
            echo "--- TAW10 ERRORS ---"
            tail -n 50 logs/err.log || true
            echo "--- TAW10-MA ERRORS ---"
            tail -n 50 logs/taw10-ma-err.log || true
            echo "--- TAW10 OUTPUT ---"
            tail -n 50 logs/out.log || true
            echo "--- TAW10-MA OUTPUT ---"
            tail -n 50 logs/taw10-ma-out.log || true

            echo "✅ Deployment complete!"

