name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/taw10v3
            git fetch origin
            git reset --hard origin/main
            
            # 1. Backend build & deploy
            cd /var/www/taw10v3/backend
            npm install
            npx prisma generate
            npx prisma db push
            npm run build
            pm2 restart taw10-backend
            
            # 2. Frontend build & deploy
            cd /var/www/taw10v3/frontend
            npm install
            npm run build
            pm2 restart taw10-frontend
