name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/taw10/taw10
            sudo -u taw10 git config --global --add safe.directory /home/taw10/taw10
            sudo -u taw10 git fetch origin
            sudo -u taw10 git reset --hard origin/main
            
            # 1. Backend build & deploy
            cd /home/taw10/taw10/backend
            sudo -u taw10 npm install
            sudo -u taw10 npx prisma generate
            sudo -u taw10 npx prisma db push
            sudo -u taw10 npm run build
            sudo -u taw10 pm2 restart taw10-backend
            
            # 2. Frontend build & deploy
            cd /home/taw10/taw10/frontend
            sudo -u taw10 npm install
            sudo -u taw10 npm run build
            sudo -u taw10 pm2 restart taw10-frontend
